[package]
name = "mousetrap"
version = "0.3.2"
edition = "2024"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4"] }
calloop = "0.14.4"
calloop-wayland-source = "0.4.1"
fontdue = "0.9.4"
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_6"] }
libc = "0.2.189"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smithay-client-toolkit = { version = "0.20.0", default-features = false, features = ["calloop"] }
wayland-backend = { version = "0.3", default-features = false, features = ["dlopen"] }
wayland-client = { version = "0.31", default-features = false }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = { version = "5.19.0", features = ["blocking-api"] }
